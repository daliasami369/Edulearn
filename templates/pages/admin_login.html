 {%load static %}
 
 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="{% static 'css/login_admin.css' %}">
</head>

<body>
                 <div class="form-box">
<h2>Admin Login</h2>

<form method="POST" action="{% url 'admin_login' %}">

    {% csrf_token %}

    <input
        type="text"
        name="username"
        placeholder="Username">

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Password">

    <br><br>

    <button type="submit">

        Login

    </button>
</form>
                 </div>
</body>
</html>
